    <section class="dashboard">
      <div class="container">
        <div class="data-table">
          <div class="title">
            <ion-icon name="location-outline"></ion-icon>
            <span class="text">Add New Site</span>
          </div>
          <form id="siteForm" class="form-grid">
            <input
              type="text"
              name="site_Code"
              placeholder="Site Code"
              required
            />
            <input
              type="text"
              name="Site_Name"
              placeholder="Site Name"
              required
            />
            <input
              type="text"
              name="Tel_Operator"
              placeholder="Operator/Tenant"
              required
            />
            <textarea name="Address" placeholder="Full Address" rows="2"></textarea>
            <input
              type="number"
              name="Location link"
              placeholder="GPS Latitude"
              step="0.000001"
            />
            <input
              type="number"
              name="Location link data"
              placeholder="GPS Longitude"
              step="0.000001"
            />
            <select name="Site_Type" required>
              <option value="">Select Site Type</option>
              <option value="Macro">Macro</option>
              <option value="Rooftop">Rooftop</option>
              <option value="Indoor">Indoor</option>
              <option value="Small Cell">Small Cell</option>
            </select>
            <textarea
              name="Access_Instructions"
              placeholder="Access Instructions"
            ></textarea>
            <select id="projectSelect" name="Project_code_User" required onchange="loadBatchesForSite()">
              <option value="">Select Project</option>
            </select>
            <select id="batchSelect" name="Batch_no_user" required disabled>
              <option value="">Select Batch</option>
            </select>
            <input type="hidden" name="Company_code" value="1000" />
            <button type="submit">Add Site</button>
          </form>
        </div>

        <div class="table-container" id="sitesTable" style="display: block;">
          <div class="table-header">
            <ion-icon name="list-outline"></ion-icon>
            All Sites Database
          </div>
          <div class="search-container" style="padding: 15px; border-bottom: 1px solid #dee2e6;">
            <input type="text" id="siteSearch" placeholder="Search sites by code, name, or operator..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
          </div>
          <div class="table-scroll">
            <table class="delivery-notes-table">
              <thead>
                <tr>
                  <th>Site Code</th>
                  <th>Site Name</th>
                  <th>Operator</th>
                  <th>Type</th>
                  <th>Project</th>
                  <th>Batch</th>
                  <th>Address</th>
                  <th>Location</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="sitesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <script>
      let editingId = null;

      // Check authentication
      if (!sessionStorage.getItem('userRole') || sessionStorage.getItem('userRole') !== 'admin') {
        window.location.href = 'index.html';
      }

      let allSites = [];

      // Auto-load sites on page load
      document.addEventListener('DOMContentLoaded', function() {
        loadSites();
        loadProjects();
        document.getElementById('siteSearch').addEventListener('input', filterSites);
      });
      
      async function loadProjects() {
        try {
          const response = await fetch('api/get-projects.php');
          const result = await response.json();
          
          if (result.success) {
            const projectSelect = document.getElementById('projectSelect');
            projectSelect.innerHTML = '<option value="">Select Project</option>';
            
            // Get unique project codes
            const uniqueProjects = [...new Map(result.data.map(p => [p.Project_code_User, p])).values()];
            
            uniqueProjects.forEach(project => {
              const option = document.createElement('option');
              option.value = project.Project_code_User;
              option.textContent = project.Project_code_User;
              projectSelect.appendChild(option);
            });
          }
        } catch (error) {
          console.error('Error loading projects:', error);
        }
      }
      
      async function loadBatchesForSite() {
        const projectCode = document.getElementById('projectSelect').value;
        const batchSelect = document.getElementById('batchSelect');
        
        if (!projectCode) {
          batchSelect.innerHTML = '<option value="">Select Batch</option>';
          batchSelect.disabled = true;
          return;
        }
        
        try {
          const formData = new FormData();
          formData.append('project_code', projectCode);
          
          const response = await fetch('api/get-individual-batches.php', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          
          if (result.success) {
            batchSelect.innerHTML = '<option value="">Select Batch</option>';
            result.data.forEach(batch => {
              const option = document.createElement('option');
              option.value = batch.Batch_no_user;
              option.textContent = batch.Batch_no_user;
              batchSelect.appendChild(option);
            });
            batchSelect.disabled = false;
          }
        } catch (error) {
          console.error('Error loading batches:', error);
        }
      }

      document
        .getElementById("siteForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = new FormData(this);
          if (editingId) {
            formData.append("id", editingId);
          }

          try {
            globalLoader.show(editingId ? 'Updating site...' : 'Adding site...');
            
            const url = editingId ? "api/update-site.php" : "api/add-site.php";
            const response = await fetch(url, {
              method: "POST",
              body: formData,
            });

            const result = await response.json();
            globalLoader.hide();

            if (result.success) {
              globalLoader.showMessage(
                editingId
                  ? "Site updated successfully!"
                  : "Site added successfully!",
                'success'
              );
              this.reset();
              editingId = null;
              loadSites();
            } else {
              globalLoader.showMessage("Error: " + result.error, 'error');
            }
          } catch (error) {
            globalLoader.hide();
            globalLoader.showMessage("Error: " + error.message, 'error');
          }
        });

      async function loadSites() {
        globalLoader.show('Loading sites...');
        
        try {
          const response = await fetch("api/get-sites.php", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const result = await response.json();

          if (result.success) {
            allSites = result.data;
            displaySites(allSites);
            document.getElementById("sitesTable").classList.remove("hidden");
          } else {
            globalLoader.showMessage("Error loading sites: " + result.error, 'error');
          }
          globalLoader.hide();
        } catch (error) {
          globalLoader.hide();
          globalLoader.showMessage("Error: " + error.message, 'error');
        }
      }

      function displaySites(sites) {
        const tbody = document.getElementById("sitesTableBody");

        if (sites.length === 0) {
          tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <ion-icon name="location-outline" class="empty-icon"></ion-icon>
                            <br>No sites found
                        </td>
                    </tr>
                `;
          return;
        }

        tbody.innerHTML = sites
          .map(
            (site) => `
                <tr>
                    <td><strong>${site.site_Code || "N/A"}</strong></td>
                    <td>${site.Site_Name || "N/A"}</td>
                    <td>${site.Tel_Operator || "N/A"}</td>
                    <td><span class="status-badge status-${(
                      site.Site_Type || "macro"
                    )
                      .toLowerCase()
                      .replace(" ", "-")}">${
              site.Site_Type || "N/A"
            }</span></td>
                    <td>${site.Project_code_User || "N/A"}</td>
                    <td>${site.Batch_no_user || "N/A"}</td>
                    <td title="${site.Address || "N/A"}">${truncateText(
              site.Address || "N/A",
              30
            )}</td>
                    <td>${site.GPS_Latitude && site.GPS_Longitude ? `${site.GPS_Latitude}, ${site.GPS_Longitude}` : 'N/A'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn edit" onclick="editSite(${
                              site.id
                            })" title="Edit">
                                <ion-icon name="create-outline"style="pointer-events: none;"></ion-icon>
                            </button>
                            <button class="action-btn delete" onclick="deleteSite(${
                              site.id
                            })" title="Delete">
                                <ion-icon name="trash-outline"style="pointer-events: none;"></ion-icon>
                            </button>
                        </div>
                    </td>
                </tr>
            `
          )
          .join("");
      }

      async function editSite(id) {
        globalLoader.show('Loading site data...');
        
        try {
          const response = await fetch("api/get-sites.php", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const result = await response.json();

          if (result.success) {
            const site = result.data.find((s) => s.id == id);
            if (site) {
              const siteCodeField = document.querySelector('[name="site_Code"]');
              const siteNameField = document.querySelector('[name="Site_Name"]');
              const operatorField = document.querySelector('[name="Tel_Operator"]');
              const addressField = document.querySelector('[name="Address"]');
              const latField = document.querySelector('[name="Location link"]');
              const lngField = document.querySelector('[name="Location link data"]');
              const typeField = document.querySelector('[name="Site_Type"]');
              const instructionsField = document.querySelector('[name="Access_Instructions"]');
              
              if (siteCodeField) siteCodeField.value = site.site_Code || "";
              if (siteNameField) siteNameField.value = site.Site_Name || "";
              if (operatorField) operatorField.value = site.Tel_Operator || "";
              if (addressField) addressField.value = site.Address || "";
              if (latField) latField.value = site.GPS_Latitude || "";
              if (lngField) lngField.value = site.GPS_Longitude || "";
              if (typeField) typeField.value = site.Site_Type || "";
              if (instructionsField) instructionsField.value = site.Access_Instructions || "";
              
              // Load project and batch data
              const projectSelect = document.getElementById('projectSelect');
              const batchSelect = document.getElementById('batchSelect');
              
              if (site.Project_code_User) {
                projectSelect.value = site.Project_code_User;
                await loadBatchesForSite();
                if (site.Batch_no_user) {
                  batchSelect.value = site.Batch_no_user;
                }
              }
              
              editingId = id;
              document.querySelector('button[type="submit"]').textContent = 'Update Site';
              document.getElementById('siteForm').scrollIntoView({ behavior: 'smooth' });
            }
          }
          globalLoader.hide();
        } catch (error) {
          globalLoader.hide();
          globalLoader.showMessage('Error loading site data', 'error');
        }
      }

      async function deleteSite(id) {
        if (!confirm("Are you sure you want to delete this site?")) return;

        try {
          const formData = new FormData();
          formData.append("id", id);

          const response = await fetch("api/delete-site.php", {
            method: "POST",
            body: formData,
          });

          const result = await response.json();

          if (result.success) {
            alert("Site deleted successfully!");
            loadSites();
          } else {
            alert("Error: " + result.error);
          }
        } catch (error) {
          alert("Error: " + error.message);
        }
      }

      function filterSites() {
        const searchTerm = document.getElementById('siteSearch').value.toLowerCase();
        
        if (!searchTerm) {
          displaySites(allSites);
          return;
        }
        
        const filteredSites = allSites.filter(site => 
          (site.site_Code && site.site_Code.toLowerCase().includes(searchTerm)) ||
          (site.Site_Name && site.Site_Name.toLowerCase().includes(searchTerm)) ||
          (site.Tel_Operator && site.Tel_Operator.toLowerCase().includes(searchTerm)) ||
          (site.Address && site.Address.toLowerCase().includes(searchTerm))
        );
        
        displaySites(filteredSites);
      }

      function truncateText(text, maxLength) {
        return text.length > maxLength
          ? text.substring(0, maxLength) + "..."
          : text;
      }
    </script>

    <script src="js/global-loader.js"></script>
    <script src="js/session.js"></script>
  </body>
