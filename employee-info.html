    <section class="dashboard">
      <div class="container">
        <div class="data-table">
          <div class="title">
            <ion-icon name="people-outline"></ion-icon>
            <span class="text">Add New Employee</span>
          </div>
          <form id="employeeForm" class="form-grid">
            <input type="text" name="first_name" placeholder="First Name" required />
            <input type="text" name="last_name" placeholder="Last Name" required />
            <select name="gender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <input type="date" name="date_of_birth" placeholder="Date of Birth" />
            <input type="email" name="email" placeholder="Email" />
            <input type="tel" name="phone_number" placeholder="Phone Number" />
            <input type="date" name="hire_date" placeholder="Hire Date" required />
            <input type="text" name="job_title" placeholder="Job Title" />
            <input type="text" name="department" placeholder="Department" />
            <input type="number" name="salary" placeholder="Salary" step="0.01" />
            <select name="status" required>
              <option value="">Select Status</option>
              <option value="Active" selected>Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <input type="text" name="App_user" placeholder="App Username" required />
            <input type="password" name="app_Password" placeholder="App Password" required />
            <select name="App_User_Status" required>
              <option value="">App User Status</option>
              <option value="Active" selected>Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <button type="submit">Add Employee</button>
          </form>
        </div>

        <div class="data-table">
          <div class="title">
            <ion-icon name="search-outline"></ion-icon>
            <span class="text">Search & Filter</span>
          </div>
          <div class="form-grid">
            <input type="text" id="searchName" placeholder="Search by Name" />
            <input type="text" id="searchEmail" placeholder="Search by Email" />
            <select id="filterDepartment">
              <option value="">All Departments</option>
            </select>
            <select id="filterStatus">
              <option value="">All Status</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <button type="button" onclick="clearFilters()">Clear Filters</button>
          </div>
        </div>

        <div class="table-container" id="employeesTable" style="display: block;">
          <div class="table-header">
            <ion-icon name="list-outline"></ion-icon>
            All Employees Database
          </div>
          <div class="table-scroll">
            <table class="delivery-notes-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Job Title</th>
                  <th>Status</th>
                  <th>Hire Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="employeesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <script>
      let editingId = null;

      if (!sessionStorage.getItem('userRole') || sessionStorage.getItem('userRole') !== 'admin') {
        window.location.href = 'index.html';
      }

      document.addEventListener('DOMContentLoaded', function() {
        loadEmployees();
        setupSearchFilters();
      });

      document.getElementById("employeeForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        if (editingId) formData.append("employee_id", editingId);

        try {
          const url = editingId ? "api/update-employee.php" : "api/add-employee.php";
          const response = await fetch(url, { method: "POST", body: formData });
          const result = await response.json();

          if (result.success) {
            alert(editingId ? "Employee updated successfully!" : "Employee added successfully!");
            this.reset();
            editingId = null;
            loadEmployees();
          } else {
            alert("Error: " + result.error);
          }
        } catch (error) {
          alert("Error: " + error.message);
        }
      });

      async function loadEmployees() {
        globalLoader.show('Loading employees...');
        try {
          const response = await fetch("api/get-employees.php");
          const result = await response.json();
          if (result.success) {
            displayEmployees(result.data);
            populateDepartmentFilter(result.data);
          } else {
            globalLoader.showMessage("Error loading employees: " + result.error, 'error');
          }
          globalLoader.hide();
        } catch (error) {
          globalLoader.hide();
          globalLoader.showMessage("Error: " + error.message, 'error');
        }
      }

      function displayEmployees(employees) {
        const tbody = document.getElementById("employeesTableBody");
        if (employees.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><ion-icon name="people-outline" class="empty-icon"></ion-icon><br>No employees found</td></tr>`;
          return;
        }

        tbody.innerHTML = employees.map(emp => `
          <tr>
            <td><strong>${emp.first_name} ${emp.last_name}</strong></td>
            <td>${emp.email || "N/A"}</td>
            <td>${emp.department || "N/A"}</td>
            <td>${emp.job_title || "N/A"}</td>
            <td><span class="status-badge status-${emp.status === "Active" ? "active" : "inactive"}">${emp.status}</span></td>
            <td>${formatDate(emp.hire_date)}</td>
            <td>
              <div class="action-buttons">
                <button class="action-btn edit" onclick="editEmployee(${emp.employee_id})" title="Edit Employee">
                  <ion-icon name="create-outline" style="pointer-events: none;"></ion-icon>
                </button>
                <button class="action-btn delete" onclick="deleteEmployee(${emp.employee_id})" title="Delete Employee">
                  <ion-icon name="trash-outline" style="pointer-events: none;"></ion-icon>
                </button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      async function editEmployee(id) {
        try {
          const response = await fetch("api/get-employees.php");
          const result = await response.json();
          if (result.success) {
            const emp = result.data.find(e => e.employee_id == id);
            if (emp) {
              Object.keys(emp).forEach(key => {
                const input = document.querySelector(`[name="${key}"]`);
                if (input) input.value = emp[key] || "";
              });
              editingId = id;
            }
          }
        } catch (error) {
          alert("Error loading employee: " + error.message);
        }
      }

      async function deleteEmployee(id) {
        if (!confirm("Are you sure you want to delete this employee?")) return;
        try {
          const formData = new FormData();
          formData.append("employee_id", id);
          const response = await fetch("api/delete-employee.php", { method: "POST", body: formData });
          const result = await response.json();
          if (result.success) {
            alert("Employee deleted successfully!");
            loadEmployees();
          } else {
            alert("Error: " + result.error);
          }
        } catch (error) {
          alert("Error: " + error.message);
        }
      }

      function setupSearchFilters() {
        ['searchName', 'searchEmail', 'filterDepartment', 'filterStatus'].forEach(id => {
          document.getElementById(id).addEventListener('input', filterEmployees);
        });
      }

      function filterEmployees() {
        const searchName = document.getElementById('searchName').value.toLowerCase();
        const searchEmail = document.getElementById('searchEmail').value.toLowerCase();
        const filterDepartment = document.getElementById('filterDepartment').value;
        const filterStatus = document.getElementById('filterStatus').value;

        document.querySelectorAll('#employeesTableBody tr').forEach(row => {
          if (row.querySelector('.empty-state')) return;
          const name = row.cells[0].textContent.toLowerCase();
          const email = row.cells[1].textContent.toLowerCase();
          const department = row.cells[2].textContent;
          const status = row.cells[4].textContent.trim();

          const matches = name.includes(searchName) && email.includes(searchEmail) &&
                         (!filterDepartment || department.includes(filterDepartment)) &&
                         (!filterStatus || status.includes(filterStatus));
          row.style.display = matches ? '' : 'none';
        });
      }

      function populateDepartmentFilter(employees) {
        const departments = [...new Set(employees.map(e => e.department).filter(d => d))];
        const select = document.getElementById('filterDepartment');
        select.innerHTML = '<option value="">All Departments</option>' + 
          departments.map(dept => `<option value="${dept}">${dept}</option>`).join('');
      }

      function clearFilters() {
        ['searchName', 'searchEmail', 'filterDepartment', 'filterStatus'].forEach(id => {
          document.getElementById(id).value = '';
        });
        filterEmployees();
      }

      function formatDate(dateString) {
        return dateString ? new Date(dateString).toLocaleDateString() : "N/A";
      }
    </script>

    <script src="js/global-loader.js"></script>

    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
